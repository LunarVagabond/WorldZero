[package]
name = "auth"
description = "Accounts, credentials, and session tokens behind a pluggable provider interface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.92"
base64 = "0.23.1"
common = { version = "0.1.0", path = "../common" }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
gateway = { version = "0.1.0", path = "../gateway" }
password-hash = { version = "0.5", features = ["getrandom", "std"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
time = { version = "0.3.55", features = ["formatting"] }
uuid = "1.25.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

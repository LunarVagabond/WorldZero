// Wire schema for `auth::gateway_protocol` — `message_type` 1
// (docs/specs/Networking_Spec.md's catalog). Source of truth for this
// message type, decided in #109, implemented in #123: `auth::gateway_protocol`
// wraps the generated Rust types from this file in a more ergonomic
// hand-written enum, but this `.proto` (not that Rust enum) is what a
// client integrator (Unity/UE5/Godot) generates against.
//
// Every id (`account_id`) crosses this boundary as a plain `string` (its
// UUID text form), not a typed field — same "opaque id, no internal
// structure exposed" discipline `docs/specs/Plugin_API.md` documents for
// the plugin ABI's ids.

syntax = "proto3";

package worldzero.auth;

message ClientMessage {
  oneof kind {
    Register register = 1;
    Login login = 2;
    Resume resume = 3;
  }
}

message Register {
  string username = 1;
  string password = 2;
}

message Login {
  string username = 1;
  string password = 2;
}

// Resumes a previously-authenticated session by presenting the
// session_token an earlier Authenticated reply issued, instead of
// re-entering a password (#195). Replied to the same way Register/Login
// are — an Authenticated with the same token back, or an Error the
// client should treat as "fall back to Login".
message Resume {
  string session_token = 1;
}

message ServerMessage {
  oneof kind {
    Authenticated authenticated = 1;
    Error error = 2;
  }
}

message Authenticated {
  string account_id = 1;
  string username = 2;
  string session_token = 3;
  // Global-scope v0 account roles (docs/specs/Auth_Spec.md's "Account
  // roles") held by this account right now, in no particular order —
  // empty if none. Lets a client build an admin-only UI without
  // inventing its own ad-hoc convention for a question the server
  // already has a structured answer to.
  repeated string roles = 4;
}

message Error {
  string message = 1;
}

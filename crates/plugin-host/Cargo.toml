[package]
name = "plugin-host"
description = "WASM runtime, sandboxing, and the host API surface exposed to plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
common = { version = "0.1.0", path = "../common" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tracing = "0.1.44"
wasmtime = { version = "48.0.0", default-features = false, features = ["runtime", "component-model", "cranelift"] }
wasmtime-wasi = "48.0.0"

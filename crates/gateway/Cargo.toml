[package]
name = "gateway"
description = "Client connection termination (TCP + UDP), protocol framing, and request routing to backing services."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-stream = "0.3.6"
bytes = "1.12.1"
common = { version = "0.1.0", path = "../common" }
futures-util = "0.3.34"
pem = "4.0.0"
rcgen = "0.14.9"
rustls = "0.23.43"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"

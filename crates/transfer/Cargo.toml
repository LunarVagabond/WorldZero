[package]
name = "transfer"
description = "Character transfer execution, ticket/cash gating, and audit trail."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
character = { version = "0.1.0", path = "../character" }
common = { version = "0.1.0", path = "../common" }
realm-directory = { version = "0.1.0", path = "../realm-directory" }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid", "json"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = "1.25.0"

[package]
name = "realm-directory"
description = "Realm registry, open/bound policy enforcement, layer assignment, and transfer eligibility."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
character = { version = "0.1.0", path = "../character" }
common = { version = "0.1.0", path = "../common" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = "1.25.0"

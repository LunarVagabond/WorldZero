[package]
name = "server"
description = "Combined-process runnable binary. Phase 1 target: wires auth, character, world, gateway, content, and chat into a single self-hostable process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
auth = { version = "0.1.0", path = "../auth" }
character = { version = "0.1.0", path = "../character" }
chat = { version = "0.1.0", path = "../chat" }
common = { version = "0.1.0", path = "../common" }
content = { version = "0.1.0", path = "../content" }
futures-util = "0.3.34"
gateway = { version = "0.1.0", path = "../gateway" }
guild = { version = "0.1.0", path = "../guild" }
plugin-host = { version = "0.1.0", path = "../plugin-host" }
prometheus = "0.14.0"
prost = "0.14.4"
realm-directory = { version = "0.1.0", path = "../realm-directory" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
uuid = "1.25.0"
world = { version = "0.1.0", path = "../world" }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

# Example declared attribute schema — see docs/specs/Data_Model_Spec.md.
# Copy this into your own game's stats.schema.yaml and adjust freely; the
# framework doesn't ship with any stats of its own (not even HP).
schema_version: 1
stats:
  - key: hp
    type: int
    default: 100
    min: 0
    max: 100
  - key: mana
    type: int
    default: 50
    min: 0
    max: 50
  - key: reputation.ironclad_guild
    type: int
    default: 0

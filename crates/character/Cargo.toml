[package]
name = "character"
description = "Character records, inventory, and declared-schema stats — the durable \"who is this player\" data."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
common = { version = "0.1.0", path = "../common" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

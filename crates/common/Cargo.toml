[package]
name = "common"
description = "Tightly-scoped cross-cutting code shared by every other crate: logging setup, shared error/result types, config loading. Not a general-purpose dumping ground — see the scope note in src/lib.rs before adding to it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace", "rt-tokio"] }
prometheus = "0.14.0"
serde = "1.0.229"
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["registry", "fmt", "env-filter"] }
uuid = { version = "1.25.0", features = ["v7", "serde"] }

[dev-dependencies]
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["parsing"] }

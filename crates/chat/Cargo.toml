[package]
name = "chat"
description = "Cross-shard messaging, presence, and channels."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
auth = { version = "0.1.0", path = "../auth" }
common = { version = "0.1.0", path = "../common" }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
futures-util = "0.3.34"
gateway = { version = "0.1.0", path = "../gateway" }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
uuid = { version = "1.25.0", features = ["v7"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

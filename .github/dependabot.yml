version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      actions-all:
        patterns: ["*"]

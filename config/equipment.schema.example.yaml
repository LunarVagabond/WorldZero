# Example declared equipment schema — loaded by the `character` crate
# (crates/character/src/equipment_schema.rs), implementing #245's
# equipment decision (#277). Copy/rename this as equipment.schema.yaml in
# the config dir your instance actually uses (WZ_CONFIG_DIR, or ./config
# by default) and adjust freely — the framework doesn't declare any
# slots or equippable items of its own, same "core has no opinion on the
# domain specifics" discipline stats.schema.yaml/crafting.schema.yaml
# already follow.
#
# `slots` is a flat, dev-defined list of slot keys. Each entry under
# `items` names one `item_type` from your inventory items, which single
# `slot` it occupies (must be one of the declared `slots`), and an
# optional `stat_deltas` map (keys must be declared in
# stats.schema.yaml) applied while worn and reversed on unequip. An
# item_type not listed here can't be equipped at all —
# `EquipItem{item_type}` is rejected with an Error. This example's deltas
# match stats.schema.example.yaml's own declared keys — a real game
# would declare its own combat stats (attack/defense/etc.) in both files
# together. The helmets use reputation.ironclad_guild (no declared
# min/max) rather than hp deliberately: stats.schema.example.yaml's hp
# starts every character already at its own declared max (100/100), so
# a positive hp delta from gear would violate that bound the moment it's
# equipped — a bounded "current value" stat like hp needs real headroom
# below its max before gear can usefully add to it, which is a choice
# for your own stats.schema.yaml, not something this example should paper
# over by picking an unbounded stat to demo the mechanism instead.
schema_version: 1
slots:
  - head
  - chest
  - weapon
items:
  - item_type: iron-helmet
    slot: head
    stat_deltas:
      reputation.ironclad_guild: 10
  - item_type: cloth-cap
    slot: head
    stat_deltas:
      reputation.ironclad_guild: 2
  - item_type: iron-sword
    slot: weapon
    stat_deltas:
      mana: -5

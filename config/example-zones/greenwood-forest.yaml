# Half of the example content pack (config/content-pack.example.yaml,
# #45) — same content as config/zone.manifest.example.yaml, plus a link
# to stonebridge-village along its eastern edge (x=500) so the two zones
# actually demonstrate a live cross-zone handoff.
schema_version: 1
id: greenwood-forest
display_name: "Greenwood Forest"

bounds:
  shape: polygon
  coordinate_system: { units: meters, origin: [0, 0] }
  points: [[0,0], [500,0], [500,500], [0,500]]

collision:
  # A real navmesh_v1 asset (#280) — a single flat, walkable polygon
  # covering this zone's whole bounds shape, enough to prove the
  # load/resolve/containment pipeline end to end. See
  # config/assets/9053d0456606fc25a498de1e85a29615605e870bbda12e4f087420ca9a00c168
  # (docs/specs/Content_Manifest_Spec.md's "navmesh_v1" section).
  asset_ref: "sha256:9053d0456606fc25a498de1e85a29615605e870bbda12e4f087420ca9a00c168"
  format: navmesh_v1

links:
  - target_zone: stonebridge-village
    edge: [[500,200], [500,300]]
    bidirectional: true

spawn_tables:
  - id: wolf-pack-01
    entity_type: npc.wolf
    points: [[120,80], [140,95]]
    max_population: 6
    respawn_seconds: 45
    route_id: wolf-patrol-01
  # world-zero-test-grounds's Evil Cube manual-test NPC (PROMPT.md §7.2)
  # — stationary, no route_id, paired with examples/evil-cube-plugin.
  - id: evil-cube-01
    entity_type: npc.evil_cube
    points: [[250, 250]]
    max_population: 1
    respawn_seconds: 30

routes:
  - id: wolf-patrol-01
    waypoints: [[110,70],[150,70],[150,110],[110,110]]
    loop: true
    speed: 1.4

triggers:
  - id: forest-entrance
    shape: { type: circle, center: [10,10], radius: 5 }
    event: on_trigger_enter
    one_shot: false

# Half of the example content pack (config/content-pack.example.yaml,
# #45) — a small second zone linked back to greenwood-forest along its
# western edge (x=0), reciprocating that zone's link so
# `ZoneRegistry::entry_point` has a matching doorway to arrive at in
# both directions.
schema_version: 1
id: stonebridge-village
display_name: "Stonebridge Village"

bounds:
  shape: polygon
  coordinate_system: { units: meters, origin: [0, 0] }
  points: [[0,0], [200,0], [200,200], [0,200]]

collision:
  # A real navmesh_v1 asset (#280) — a single flat, walkable polygon
  # covering this zone's whole bounds shape. See
  # config/assets/48b4d7e0c79652088cb1bb4a73a25baea58d1738681df133be226a5dfa2b92bd
  # (docs/specs/Content_Manifest_Spec.md's "navmesh_v1" section).
  asset_ref: "sha256:48b4d7e0c79652088cb1bb4a73a25baea58d1738681df133be226a5dfa2b92bd"
  format: navmesh_v1

links:
  - target_zone: greenwood-forest
    edge: [[0,80], [0,120]]
    bidirectional: true

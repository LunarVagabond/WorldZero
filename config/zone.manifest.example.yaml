# Example zone manifest — loaded by the `content` crate
# (crates/content/src/manifest.rs), see docs/specs/Content_Manifest_Spec.md.
# Copy/rename this as zone.manifest.yaml in the config dir your instance
# actually uses (WZ_CONFIG_DIR, or ./config by default) and adjust freely;
# the framework doesn't ship with any real game content of its own.
schema_version: 1
id: greenwood-forest
display_name: "Greenwood Forest"

bounds:
  shape: polygon
  coordinate_system: { units: meters, origin: [0, 0] }
  points: [[0,0], [500,0], [500,500], [0,500]]

collision:
  # A real navmesh_v1 asset (#280) — same shape as
  # config/example-zones/greenwood-forest.yaml's, so it reuses the same
  # content-addressed file (config/assets/9053d0...): identical geometry
  # hashes identically, by design (docs/specs/Content_Manifest_Spec.md's
  # "Content-addressing" section).
  asset_ref: "sha256:9053d0456606fc25a498de1e85a29615605e870bbda12e4f087420ca9a00c168"
  format: navmesh_v1

spawn_tables:
  - id: wolf-pack-01
    entity_type: npc.wolf
    points: [[120,80], [140,95]]
    max_population: 6
    respawn_seconds: 45
    route_id: wolf-patrol-01

routes:
  - id: wolf-patrol-01
    waypoints: [[110,70],[150,70],[150,110],[110,110]]
    loop: true
    speed: 1.4

triggers:
  - id: forest-entrance
    shape: { type: circle, center: [10,10], radius: 5 }
    event: on_trigger_enter
    one_shot: false
